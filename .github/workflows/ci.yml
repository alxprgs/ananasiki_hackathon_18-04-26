name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: raspberry/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r raspberry/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  arduino-build:
    name: Arduino Uno compile
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Update Arduino indexes
        run: |
          arduino-cli core update-index
          arduino-cli lib update-index

      - name: Install Arduino Uno platform and libraries
        run: |
          arduino-cli core install arduino:avr
          arduino-cli lib install Servo

      - name: Compile firmware for Arduino Uno
        run: arduino-cli compile --fqbn arduino:avr:uno --build-path .arduino-build arduino
